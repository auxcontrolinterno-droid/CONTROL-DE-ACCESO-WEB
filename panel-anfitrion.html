<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anfitrión — Control de acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#182449; --ink-soft:#3d4a78;
    --paper:#f5f3ee; --card:#ffffff;
    --gold:#c8922f; --gold-soft:#f2e3c4;
    --green:#2f7a54; --green-soft:#e3f2e9;
    --blue-soft:#dde6fb; --blue:#2f4f9e;
    --line:#e2ded3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  header{
    background:var(--ink);
    color:#fdf9ee;
    padding:18px 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  header .left{display:flex;align-items:center;gap:10px;}
  header .mark{
    width:32px;height:32px;border-radius:8px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  }
  header .ttl{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  header .role{font-size:12px;color:#b9c0dd;}
  header select{
    background:rgba(255,255,255,.08);
    color:#fdf9ee;
    border:1px solid rgba(255,255,255,.25);
    border-radius:9px;
    padding:8px 10px;
    font-size:13px;
    font-family:'Inter',sans-serif;
  }
  header select option{color:#111;}

  main{max-width:1000px;margin:0 auto;padding:26px 20px 60px;}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .tab{
    padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);
    display:flex;align-items:center;gap:7px;white-space:nowrap;flex:1 1 auto;justify-content:center;
  }
  .tab.active{background:var(--ink);color:#fdf9ee;border-color:var(--ink);}
  .count{background:var(--gold);color:var(--ink);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700;flex-shrink:0;}
  .tab.active .count{background:var(--gold-soft);}
  @media (max-width:520px){ .tabs{flex-direction:column;} .tab{width:100%;justify-content:space-between;} }

  section{display:none;} section.active{display:block;}

  .visit-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:10px;display:flex;flex-wrap:wrap;
    align-items:center;justify-content:space-between;gap:14px;
  }
  .who{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 220px;}
  .avatar{
    width:42px;height:42px;border-radius:11px;background:var(--ink);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:14px;flex-shrink:0;
  }
  .who .name{font-weight:600;font-size:15px;}
  .who .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .who .meta code{font-family:'IBM Plex Mono',monospace;background:#f1efe9;padding:1px 5px;border-radius:4px;}

  .status{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:5px 10px;border-radius:20px;}
  .status.en_edificio{background:var(--blue-soft);color:var(--blue);}
  .status.verificado{background:var(--green-soft);color:var(--green);}
  .status.registrado{background:var(--gold-soft);color:#8a651c;}
  .status.pendiente{background:#eee;color:#777;}
  .status.salida{background:#eee;color:#777;}

  .actions-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0;}
  .btn-sm{border:1.5px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);}
  .btn-sm.primary{background:var(--ink);color:#fdf9ee;border-color:var(--ink);}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:14px;}

  /* Crear invitación */
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:480px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:7px;}
  .field input{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--line);font-size:15px;font-family:'Inter',sans-serif;background:#fbfaf7;color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--gold);background:#fff;}
  .btn-full{width:100%;padding:13px;border-radius:11px;border:none;background:var(--ink);color:#fdf9ee;font-weight:600;font-size:15px;cursor:pointer;}

  .qr-result{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px;max-width:480px;text-align:center;
  }
  .qr-box{
    width:186px;height:186px;margin:0 auto 16px;border-radius:14px;
    background:#fff;
    border:8px solid #fff;
    outline:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .qr-token{font-family:'IBM Plex Mono',monospace;background:#f1efe9;padding:8px 12px;border-radius:8px;font-size:13px;display:inline-block;margin-bottom:14px;}
  .link-list{list-style:none;padding:0;margin:14px 0 0;font-size:12.5px;color:var(--ink-soft);}

  /* Login */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:30px 26px;
  }
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .login-card .mark{
    width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  }
  .login-card .brand span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .login-card h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px;}
  .login-card .sub{margin:0 0 20px;color:var(--ink-soft);font-size:14px;}
  .login-error{color:#b23a3a;font-size:13px;margin:10px 0 0;min-height:16px;}
  .login-toggle{margin:14px 0 0;font-size:13px;color:var(--ink-soft);text-align:center;}
  .login-toggle a{color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer;}
  .login-toggle a:hover{text-decoration:underline;}
  header .btn-logout{
    background:rgba(255,255,255,.08);color:#fdf9ee;border:1px solid rgba(255,255,255,.25);
    border-radius:9px;padding:8px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;
  }
  header .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="mark">CA</div><span>Control de acceso</span></div>
    <h1>Panel del anfitrión</h1>
    <p class="sub">Iniciá sesión con tu cuenta para continuar.</p>
    <div class="field"><label>Correo</label><input id="login-email" type="email" autofocus></div>
    <div class="field"><label>Contraseña</label><input id="login-pass" type="password"></div>
    <div class="field" id="campo-cargo" style="display:none;">
      <label>Cargo</label>
      <select id="reg-cargo">
        <option value="" disabled selected>Seleccioná tu cargo</option>
        <option value="Docente">Docente</option>
        <optgroup label="Vicerrectoría">
          <option value="Vicerrectoría – Nido">Nido</option>
          <option value="Vicerrectoría – Preescolar">Preescolar</option>
          <option value="Vicerrectoría – Primaria">Primaria</option>
          <option value="Vicerrectoría – Bachillerato">Bachillerato</option>
        </optgroup>
        <optgroup label="Psicología">
          <option value="Psicología – Nido">Nido</option>
          <option value="Psicología – Preescolar">Preescolar</option>
          <option value="Psicología – Primaria">Primaria</option>
          <option value="Psicología – Bachillerato">Bachillerato</option>
        </optgroup>
        <option value="Rectoría">Rectoría</option>
        <option value="Administración">Administración</option>
        <option value="Innovation Center">Innovation Center</option>
        <option value="Recursos Humanos">Recursos Humanos</option>
        <option value="Admisiones">Admisiones</option>
        <option value="Cocina">Cocina</option>
        <option value="Tesorería">Tesorería</option>
        <option value="Cartera">Cartera</option>
        <option value="Comunicación">Comunicación</option>
        <option value="Tecnología">Tecnología</option>
        <option value="Secretaría Académica">Secretaría Académica</option>
        <option value="SST">SST</option>
        <option value="Movilízate">Movilízate</option>
      </select>
    </div>
    <button class="btn-full" id="btn-login">Ingresar</button>
    <button class="btn-full" id="btn-registrar" style="display:none;">Crear cuenta</button>
    <p class="login-error" id="login-error"></p>
    <p class="login-toggle"><a href="#" id="link-toggle-registro">¿No tenés cuenta? Crear una</a></p>
  </div>
</div>

<div id="app-wrap" style="display:none;">
<header>
  <div class="left">
    <div class="mark">CA</div>
    <div>
      <div class="ttl">Control de acceso</div>
      <div class="role">Panel del anfitrión</div>
    </div>
  </div>
  <div class="right">
    <select id="sel-anfitrion"></select>
    <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
  </div>
</header>
<main>
  <div class="tabs">
    <div class="tab active" data-tab="hoy">👤 Mis invitados hoy <span class="count" id="c-hoy">0</span></div>
    <div class="tab" data-tab="invitar">➕ Crear invitación</div>
    <div class="tab" data-tab="historial">🕘 Historial</div>
  </div>

  <section id="sec-hoy" class="active"></section>
  <section id="sec-invitar"></section>
  <section id="sec-historial"></section>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore, collection, query, where, onSnapshot,
  doc, setDoc, getDoc, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhsnB9RWok_5Nmb2Nr2vusKETSURnfTO0",
  authDomain: "control-de-acceso-6fbea.firebaseapp.com",
  projectId: "control-de-acceso-6fbea",
  storageBucket: "control-de-acceso-6fbea.firebasestorage.app",
  messagingSenderId: "873946827663",
  appId: "1:873946827663:web:2a0393efbeacb5442799fa"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ------------------------------------------------------------------
   Login: mientras no haya sesión, se muestra solo el formulario.
   Apenas Firebase confirma la sesión, se muestra el panel y recién
   ahí arrancamos los listeners de Firestore (iniciarPanel).
   ------------------------------------------------------------------ */
const loginScreen = document.getElementById("login-screen");
const appWrap = document.getElementById("app-wrap");
let panelIniciado = false;

onAuthStateChanged(auth, (user) => {
  if(user){
    loginScreen.style.display = "none";
    appWrap.style.display = "block";
    if(!panelIniciado){ panelIniciado = true; iniciarPanel(); }
  } else {
    panelIniciado = false;
    loginScreen.style.display = "flex";
    appWrap.style.display = "none";
  }
});

document.getElementById("btn-login").onclick = async () => {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  const btn = document.getElementById("btn-login");
  const err = document.getElementById("login-error");
  err.textContent = "";
  if(!email || !pass) return;
  btn.disabled = true; btn.textContent = "Ingresando...";
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    console.error("Error de login:", e);
    err.textContent = "Correo o contraseña incorrectos.";
  }
  btn.disabled = false; btn.textContent = "Ingresar";
};

document.getElementById("btn-logout").onclick = () => signOut(auth);

/* ------------------------------------------------------------------
   Alternar entre "Iniciar sesión" y "Crear cuenta" en la misma
   pantalla, reutilizando los campos de correo y contraseña.
   ------------------------------------------------------------------ */
let modoRegistro = false;
const btnLogin = document.getElementById("btn-login");
const btnRegistrar = document.getElementById("btn-registrar");
const linkToggle = document.getElementById("link-toggle-registro");
const subLogin = document.querySelector("#login-screen .sub");
const loginError = document.getElementById("login-error");

linkToggle.onclick = (e) => {
  e.preventDefault();
  modoRegistro = !modoRegistro;
  loginError.textContent = "";
  const campoCargo = document.getElementById("campo-cargo");
  if(modoRegistro){
    btnLogin.style.display = "none";
    btnRegistrar.style.display = "block";
    campoCargo.style.display = "block";
    subLogin.textContent = "Creá tu cuenta para continuar.";
    linkToggle.textContent = "¿Ya tenés cuenta? Iniciar sesión";
  } else {
    btnLogin.style.display = "block";
    btnRegistrar.style.display = "none";
    campoCargo.style.display = "none";
    subLogin.textContent = "Iniciá sesión con tu cuenta para continuar.";
    linkToggle.textContent = "¿No tenés cuenta? Crear una";
  }
};

btnRegistrar.onclick = async () => {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  const cargo = document.getElementById("reg-cargo").value;
  loginError.textContent = "";
  if(!email || !pass) return;
  if(pass.length < 6){
    loginError.textContent = "La contraseña debe tener al menos 6 caracteres.";
    return;
  }
  if(!cargo){
    loginError.textContent = "Elegí tu cargo para crear la cuenta.";
    return;
  }
  btnRegistrar.disabled = true; btnRegistrar.textContent = "Creando cuenta...";
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "usuarios", cred.user.uid), {
      email, cargo, rol: "anfitrion", creado: serverTimestamp()
    });
    // Lista pública de áreas con cuenta de anfitrión, para que el kiosco
    // la use en el desplegable "¿Con quién tenés cita?" (merge por si
    // varias cuentas comparten el mismo cargo/área).
    await setDoc(doc(db, "areas", cargo), { nombre: cargo }, { merge: true });
  }catch(e){
    console.error("Error creando la cuenta:", e);
    if(e.code === "auth/email-already-in-use"){
      loginError.textContent = "Ese correo ya tiene una cuenta. Iniciá sesión.";
    } else if(e.code === "auth/weak-password"){
      loginError.textContent = "La contraseña es muy débil (mínimo 6 caracteres).";
    } else if(e.code === "auth/invalid-email"){
      loginError.textContent = "El correo no es válido.";
    } else {
      loginError.textContent = "No pudimos crear la cuenta. Intentá de nuevo.";
    }
  }
  btnRegistrar.disabled = false; btnRegistrar.textContent = "Crear cuenta";
};

/* ------------------------------------------------------------------
   "visitas" viene de Firestore en tiempo real, filtrada por el
   anfitrión seleccionado. Cada vez que cambia algo en Firestore
   (por ejemplo, seguridad verifica a alguien), esta lista se
   actualiza sola gracias a onSnapshot.
   ------------------------------------------------------------------ */
const anfitriones = [
  "Coordinación Preescolar","Coordinación Primaria","Coordinación Bachillerato",
  "Rectoría","Recursos Humanos","Compras y Suministros"
];

let anfitrionActual = "Coordinación Primaria";
let visitas = []; // [{ id, ...datosDeLaVisita }]
let unsubVisitas = null;

function suscribirVisitas(){
  if(unsubVisitas) unsubVisitas(); // deja de escuchar al anfitrión anterior
  const q = query(collection(db, "visitas"), where("anfitrion", "==", anfitrionActual));
  unsubVisitas = onSnapshot(q, (snap) => {
    visitas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
  }, (err) => {
    console.error("Error escuchando visitas:", err);
  });
}

/* ------------------------------- UI base ------------------------------- */
async function iniciarPanel(){
  const selAnf = document.getElementById("sel-anfitrion");

  // Cada anfitrión ve únicamente su propio cargo/área, no la lista completa.
  let cargoUsuario = null;
  try{
    const snapUsuario = await getDoc(doc(db, "usuarios", auth.currentUser.uid));
    if(snapUsuario.exists()) cargoUsuario = snapUsuario.data().cargo || null;
  }catch(e){
    console.error("Error obteniendo el cargo del usuario:", e);
  }

  selAnf.innerHTML = "";
  const o = document.createElement("option");
  o.value = cargoUsuario || anfitrionActual;
  o.textContent = cargoUsuario || anfitrionActual;
  selAnf.appendChild(o);
  selAnf.value = o.value;
  selAnf.disabled = true; // no puede cambiar de área, solo ve la suya
  anfitrionActual = o.value;

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("sec-"+tab.dataset.tab).classList.add("active");
    };
  });

  renderInvitar(); // esta pestaña no depende de Firestore, se puede pintar ya
  suscribirVisitas(); // arranca a escuchar Firestore para "Mis invitados hoy" e "Historial"
}

const iniciales = n => n.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
const hora = d => {
  if(!d) return "—";
  const fecha = d.toDate ? d.toDate() : new Date(d); // soporta Timestamp de Firestore
  return fecha.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
};
const nombreEstado = { registrado:"Registrado", verificado:"Verificado por seguridad", en_edificio:"En el edificio", salida:"Salida registrada" };

/* --------------------------- Mis invitados hoy --------------------------- */
function renderHoy(){
  const sec = document.getElementById("sec-hoy");
  const lista = visitas.filter(v=>v.anfitrion===anfitrionActual && v.estado!=="salida");
  document.getElementById("c-hoy").textContent = lista.length;
  if(lista.length===0){ sec.innerHTML = `<div class="empty">No tenés invitados activos en este momento.</div>`; return; }
  sec.innerHTML = lista.map(v=>`
    <div class="visit-card">
      <div class="who">
        <div class="avatar">${iniciales(v.nombre)}</div>
        <div>
          <div class="name">${v.nombre}</div>
          <div class="meta"><code>${v.documento}</code> · ${v.entidad} · llegó a las ${hora(v.hora)}</div>
        </div>
      </div>
      <div class="actions-row">
        <span class="status ${v.estado}">${nombreEstado[v.estado]}</span>
        ${v.estado==="en_edificio" ? `<button class="btn-sm primary" data-id="${v.id}" data-action="salida">Registrar salida</button>` : `<span class="btn-sm" style="opacity:.55;cursor:default;">Esperando verificación de seguridad</span>`}
      </div>
    </div>`
  ).join("");
  sec.querySelectorAll("[data-action='salida']").forEach(btn=>{
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "Guardando...";
      try{
        await updateDoc(doc(db, "visitas", btn.dataset.id), { estado: "salida" });
      }catch(e){
        console.error("Error registrando salida:", e);
        alert("No pudimos registrar la salida. Intentá de nuevo.");
        btn.disabled = false; btn.textContent = "Registrar salida";
      }
    };
  });
}

/* ------------------------------- Historial ------------------------------- */
function renderHistorial(){
  const sec = document.getElementById("sec-historial");
  const lista = visitas.filter(v=>v.anfitrion===anfitrionActual);
  if(lista.length===0){ sec.innerHTML = `<div class="empty">Todavía no tenés visitas registradas.</div>`; return; }
  sec.innerHTML = lista.map(v=>`
    <div class="visit-card">
      <div class="who">
        <div class="avatar">${iniciales(v.nombre)}</div>
        <div>
          <div class="name">${v.nombre}</div>
          <div class="meta"><code>${v.documento}</code> · ${v.entidad} · ${hora(v.hora)}</div>
        </div>
      </div>
      <span class="status ${v.estado}">${nombreEstado[v.estado]}</span>
    </div>
  `).join("");
}

/* ------------------------------ Crear invitación ------------------------------ */
function renderInvitar(){
  const sec = document.getElementById("sec-invitar");
  sec.innerHTML = `
    <div class="form-card">
      <div class="field"><label>Nombre del invitado</label><input id="in-nombre" placeholder="Ej: Andrea Salazar"></div>
      <div class="field"><label>Documento de identificación</label><input id="in-doc" placeholder="Número de cédula, pasaporte, etc."></div>
      <div class="field"><label>Entidad a la que pertenece</label><input id="in-entidad" placeholder="Empresa u organización"></div>
      <div class="field"><label>Número de contacto</label><input id="in-contacto" placeholder="Teléfono del invitado"></div>
      <div class="field"><label>Contacto de emergencia (nombre)</label><input id="in-emnombre" placeholder="Nombre"></div>
      <div class="field"><label>Contacto de emergencia (número)</label><input id="in-emtel" placeholder="Teléfono"></div>
      <div class="field"><label>Fecha y hora de la cita</label><input id="in-fecha" type="datetime-local"></div>
      <button class="btn-full" id="btn-generar">Generar QR de invitación</button>
    </div>
    <div id="resultado-qr" style="margin-top:18px;"></div>
  `;
  document.getElementById("btn-generar").onclick = async () => {
    const nombre = document.getElementById("in-nombre").value.trim();
    const docNum = document.getElementById("in-doc").value.trim();
    const entidad = document.getElementById("in-entidad").value.trim();
    const contacto = document.getElementById("in-contacto").value.trim();
    const emnombre = document.getElementById("in-emnombre").value.trim();
    const emtel = document.getElementById("in-emtel").value.trim();
    const fecha = document.getElementById("in-fecha").value;
    if(!nombre || !docNum || !entidad || !contacto || !emnombre || !emtel || !fecha) return;

    const btnGenerar = document.getElementById("btn-generar");
    btnGenerar.disabled = true; btnGenerar.textContent = "Generando...";

    const token = "INV-" + Date.now().toString().slice(-6);
    const inv = {
      token, nombre, documento: docNum, entidad, contacto,
      emergenciaNombre: emnombre, emergenciaTelefono: emtel,
      fecha, anfitrion: anfitrionActual, estado: "pendiente",
      creada: serverTimestamp()
    };

    try{
      // Se guarda con el token como ID del documento para poder buscarla
      // fácilmente después desde el formulario del visitante.
      await setDoc(doc(db, "invitaciones", token), inv);
    }catch(e){
      console.error("Error guardando la invitación:", e);
      alert("No pudimos generar la invitación. Revisá tu conexión e intentá de nuevo.");
      btnGenerar.disabled = false; btnGenerar.textContent = "Generar QR de invitación";
      return;
    }

    btnGenerar.disabled = false; btnGenerar.textContent = "Generar QR de invitación";
    document.getElementById("resultado-qr").innerHTML = `
      <div class="qr-result">
        <div class="qr-box" id="qr-canvas"></div>
        <div class="qr-token">${token}</div>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">
          Invitación para <strong>${nombre}</strong> (${entidad})<br>
          ${new Date(fecha).toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short"})}
        </p>
        <ul class="link-list">
          <li>Al escanearlo, todos sus datos quedan precargados en el formulario de registro.</li>
          <li>Compartilo por el medio que prefieras (WhatsApp, correo, imprimirlo).</li>
        </ul>
      </div>
    `;
    // El contenido real del QR sería la URL del formulario público con el token,
    // ej: https://registro.tuempresa.com/?inv=INV-1234 — acá usamos el token
    // como marcador de posición hasta que exista esa URL definitiva.
    new QRCode(document.getElementById("qr-canvas"), {
      text: token,
      width: 168,
      height: 168,
      colorDark: "#182449",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  };
}

function renderAll(){
  renderHoy();
  renderHistorial();
  // renderInvitar() NO va acá: se pinta una sola vez al inicio.
  // Si se llamara en cada actualización de Firestore, borraría el QR
  // recién generado o lo que la persona esté escribiendo en el formulario.
}
</script>
