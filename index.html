<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182449;
    --ink-soft:#3d4a78;
    --paper:#f5f3ee;
    --card:#ffffff;
    --gold:#c8922f;
    --gold-soft:#f2e3c4;
    --green:#2f7a54;
    --red:#b23a3a;
    --line:#e2ded3;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #22305f 0%, transparent 55%),
      var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .kiosk{
    width:100%;
    max-width:520px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    color:var(--ink);
  }
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-soft);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
  }
  .brand span{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    font-size:15px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 20px 50px -25px rgba(24,36,73,.35);
    padding:34px 30px 28px;
    position:relative;
    overflow:hidden;
  }
  .steps{
    display:flex;
    gap:6px;
    margin-bottom:22px;
  }
  .steps i{
    height:4px;
    flex:1;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .steps i b{
    display:block;
    height:100%;
    width:0%;
    background:var(--gold);
    transition:width .35s ease;
  }
  .steps i.done b{width:100%;}
  .steps i.active b{width:100%;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    line-height:1.25;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  p.sub{
    margin:0 0 24px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .field input, .field select{
    width:100%;
    padding:13px 14px;
    border-radius:11px;
    border:1.5px solid var(--line);
    font-size:16px;
    font-family:'Inter',sans-serif;
    background:#fbfaf7;
    color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--gold);
    background:#fff;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .type-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:6px;}
  .type-btn{
    display:flex;align-items:center;gap:12px;
    padding:16px 16px;
    border-radius:13px;
    border:1.5px solid var(--line);
    background:#fbfaf7;
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
  }
  .type-btn:hover{border-color:var(--gold);}
  .type-btn .ic{
    width:38px;height:38px;border-radius:10px;
    background:var(--ink);
    color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    flex-shrink:0;
  }
  .type-btn .tt{font-weight:600;font-size:15px;}
  .type-btn .dd{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .zones{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .zone-btn{
    padding:12px 10px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:#fbfaf7;
    font-size:13.5px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    line-height:1.3;
  }
  .zone-btn.sel{border-color:var(--gold);background:var(--gold-soft);}
  .zone-btn[data-academic="1"].sel{border-color:var(--red);background:#f6dede;}
  .actions{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  button.btn{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--ink);
    color:#fdf9ee;
    flex:1;
  }
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line);
  }
  .badge-card{
    text-align:center;
    padding:10px 0 4px;
  }
  .badge-card .credential{
    margin:0 auto 22px;
    width:220px;
    border-radius:16px;
    background:var(--ink);
    color:#fdf9ee;
    padding:22px 18px 18px;
    position:relative;
    box-shadow:0 18px 30px -18px rgba(24,36,73,.6);
  }
  .credential .stripe{
    position:absolute;top:0;left:0;right:0;height:8px;
    background:var(--gold);
    border-radius:16px 16px 0 0;
  }
  .credential .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
    margin:14px 0 2px;
  }
  .credential .role{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--gold-soft);
  }
  .credential .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#b9c0dd;
    margin-top:14px;
  }
  .alert-banner{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:#f6dede;
    border:1px solid #e3b4b4;
    color:var(--red);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    margin-top:14px;
  }
  .found-banner{
    background:#eaf3ee;
    border:1px solid #b9dcc5;
    color:var(--green);
    border-radius:12px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:18px;
  }
  .hint{font-size:12px;color:var(--ink-soft);margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="kiosk">
  <div class="brand"><div class="mark">CA</div><span>Control de acceso</span></div>
  <div class="card">
    <div class="steps" id="steps"></div>
    <div id="app"></div>
  </div>
  <p class="hint" id="hint"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc, collection, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhsnB9RWok_5Nmb2Nr2vusKETSURnfTO0",
  authDomain: "control-de-acceso-6fbea.firebaseapp.com",
  projectId: "control-de-acceso-6fbea",
  storageBucket: "control-de-acceso-6fbea.firebasestorage.app",
  messagingSenderId: "873946827663",
  appId: "1:873946827663:web:2a0393efbeacb5442799fa"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

const anfitriones = [
  "Coordinación Preescolar",
  "Coordinación Primaria",
  "Coordinación Bachillerato",
  "Rectoría",
  "Recursos Humanos",
  "Compras y Suministros"
]; // lista de respaldo, solo se usa si falla la carga desde Firestore

let anfitrionesDisponibles = [...anfitriones];

async function cargarAnfitriones() {
  try {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 5000));
    const snap = await Promise.race([getDocs(collection(db, "areas")), timeout]);
    const nombres = snap.docs.map(d => d.data().nombre).filter(Boolean);
    if (nombres.length) {
      anfitrionesDisponibles = [...new Set(nombres)].sort((a, b) => a.localeCompare(b, "es"));
      if (state.step === "destino") render(); // refresca el desplegable si ya está en pantalla
    }
  } catch (e) {
    console.warn("No se pudo cargar la lista de áreas, se usa la lista de respaldo:", e);
  }
}
cargarAnfitriones();

const zonas = [
  { nombre: "Edificio administrativo", academica: false },
  { nombre: "Centro de innovación", academica: false },
  { nombre: "Cocina", academica: false },
  { nombre: "Cafetorium", academica: false },
  { nombre: "Petit cafetorium", academica: false },
  { nombre: "Polideportivo", academica: false },
  { nombre: "Canchas externas", academica: false },
  { nombre: "Edificio académico (preescolar, primaria, bachillerato)", academica: true }
];

/* ------------------------------------------------------------------
   Estado del wizard
   ------------------------------------------------------------------ */
let state = {
  step: "cedula",       // cedula -> tipo -> nombre -> documento -> contacto -> entidad -> emergencia -> destino -> listo
  persona: null,
  esConocida: false,
  data: {
    tipo: null,
    nombre: "",
    documentoTipo: "Cédula de ciudadanía",
    documento: "",
    contacto: "",
    entidad: "",
    emergenciaNombre: "",
    emergenciaTelefono: "",
    anfitrion: null,
  zona: null,
  vehiculo: null,
  placa: ""
}
};

const totalStepsFor = () => state.esConocida ? 3 : 8; // aprox, solo para la barra de progreso
function stepIndex(){
  const order = state.esConocida
    ? ["cedula","confirmar","vehiculo","placa","destino","listo"]
    : ["cedula","tipo","nombre","documento","contacto","entidad","emergencia","vehiculo","placa","destino","listo"];
  return order.indexOf(state.step);
}
function stepOrderLength(){
  return state.esConocida ? 6 : 11;
}

function renderSteps(){
  const el = document.getElementById("steps");
  el.innerHTML = "";
  const n = stepOrderLength() - 1; // sin contar "listo" como barra propia visible extra
  for(let i=0;i<n;i++){
    const dot = document.createElement("i");
    if(i < stepIndex()) dot.className = "done";
    else if(i === stepIndex()) dot.className = "active";
    dot.innerHTML = "<b></b>";
    el.appendChild(dot);
  }
}

function go(step){
  state.step = step;
  render();
}

function app(){ return document.getElementById("app"); }

function render(){
  renderSteps();
  const s = state.step;
  if(s === "cedula") return renderCedula();
  if(s === "confirmar") return renderConfirmar();
  if(s === "tipo") return renderTipo();
  if(s === "nombre") return renderNombre();
  if(s === "documento") return renderDocumento();
  if(s === "contacto") return renderContacto();
  if(s === "entidad") return renderEntidad();
  if (s === "emergencia") return renderEmergencia();
if (s === "vehiculo") return renderVehiculo();
if (s === "placa") return renderPlaca();
if (s === "destino") return renderDestino();
  if(s === "listo") return renderListo();
}

/* --------------------------- Paso: cédula --------------------------- */
function renderCedula(){
  app().innerHTML = `
    <h1>Bienvenido</h1>
    <p class="sub">Ingresá tu número de documento para comenzar el registro.</p>
    <div class="field">
      <label>Número de documento</label>
      <input id="in-cedula" inputmode="numeric" placeholder="Ej: 1020304050" autofocus>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("btn-continuar").onclick = async () => {
    const val = document.getElementById("in-cedula").value.trim();
    if(!val) return;
    state.data.documento = val;

    const btn = document.getElementById("btn-continuar");
    btn.disabled = true; btn.textContent = "Buscando...";

    let encontrada = null;
try {
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 4000));
  const snap = await Promise.race([getDoc(doc(db, "personas", val)), timeout]);
  if (snap.exists()) encontrada = snap.data();
} catch (e) {
  console.warn("No se pudo verificar el documento a tiempo, se continúa como registro nuevo:", e);
  encontrada = null;
}

    if(encontrada){
      state.persona = encontrada;
      state.esConocida = true;
      state.data.nombre = encontrada.nombre;
      state.data.documentoTipo = encontrada.documentoTipo;
      state.data.contacto = encontrada.contacto;
      state.data.entidad = encontrada.entidad;
      state.data.emergenciaNombre = encontrada.emergenciaNombre;
      state.data.emergenciaTelefono = encontrada.emergenciaTelefono;
      go("confirmar");
    } else {
      state.esConocida = false;
      go("tipo");
    }
  };
}

/* ----------------------- Paso: confirmar datos ----------------------- */
function renderConfirmar(){
  app().innerHTML = `
    <h1>Confirmá tus datos</h1>
    <div class="found-banner">Ya tenemos un registro con este documento. Verificá que siga vigente.</div>
    <div class="field"><label>Nombre completo</label><input value="${state.data.nombre}" disabled></div>
    <div class="grid2">
      <div class="field"><label>Contacto</label><input value="${state.data.contacto}" disabled></div>
      <div class="field"><label>Entidad</label><input value="${state.data.entidad}" disabled></div>
    </div>
    <div class="field"><label>¿Qué tipo de visita hacés hoy?</label></div>
    <div class="type-grid" id="tipo-grid"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar" disabled>Continuar</button>
    </div>
  `;
  const tipos = [
    {id:"invitado", tt:"Invitado", dd:"Tenés una cita con alguien del colegio", ic:"IN"},
    {id:"proveedor", tt:"Proveedor", dd:"Entregás o suministrás algo", ic:"PR"},
    {id:"contratista", tt:"Contratista", dd:"Realizás un trabajo o servicio", ic:"CT"}
  ];
  const grid = document.getElementById("tipo-grid");
  tipos.forEach(t=>{
    const b = document.createElement("div");
    b.className = "type-btn";
    b.innerHTML = `<div class="ic">${t.ic}</div><div><div class="tt">${t.tt}</div><div class="dd">${t.dd}</div></div>`;
    b.onclick = () => {
      state.data.tipo = t.id;
      [...grid.children].forEach(c=>c.style.borderColor="var(--line)");
      b.style.borderColor = "var(--gold)";
      document.getElementById("btn-continuar").disabled = false;
    };
    grid.appendChild(b);
  });
  document.getElementById("btn-atras").onclick = () => go("cedula");
  document.getElementById("btn-continuar").onclick = () => go("vehiculo");
}

/* --------------------------- Paso: tipo (nuevo) --------------------------- */
function renderTipo(){
  app().innerHTML = `
    <h1>¿Qué tipo de visita hacés?</h1>
    <p class="sub">No encontramos un registro previo con ese documento. Completemos tus datos.</p>
    <div class="type-grid" id="tipo-grid"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar" disabled>Continuar</button>
    </div>
  `;
  const tipos = [
    {id:"invitado", tt:"Invitado", dd:"Tenés una cita con alguien del colegio", ic:"IN"},
    {id:"proveedor", tt:"Proveedor", dd:"Entregás o suministrás algo", ic:"PR"},
    {id:"contratista", tt:"Contratista", dd:"Realizás un trabajo o servicio", ic:"CT"}
  ];
  const grid = document.getElementById("tipo-grid");
  tipos.forEach(t=>{
    const b = document.createElement("div");
    b.className = "type-btn";
    b.innerHTML = `<div class="ic">${t.ic}</div><div><div class="tt">${t.tt}</div><div class="dd">${t.dd}</div></div>`;
    b.onclick = () => {
      state.data.tipo = t.id;
      [...grid.children].forEach(c=>c.style.borderColor="var(--line)");
      b.style.borderColor = "var(--gold)";
      document.getElementById("btn-continuar").disabled = false;
    };
    grid.appendChild(b);
  });
  document.getElementById("btn-atras").onclick = () => go("cedula");
  document.getElementById("btn-continuar").onclick = () => go("nombre");
}

/* --------------------------- Paso: nombre --------------------------- */
function renderNombre(){
  app().innerHTML = `
    <h1>Nombre completo</h1>
    <p class="sub">Escribí tu nombre tal como aparece en tu documento.</p>
    <div class="field"><label>Nombre completo</label><input id="in-nombre" value="${state.data.nombre}" autofocus></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("btn-atras").onclick = () => go("tipo");
  document.getElementById("btn-continuar").onclick = () => {
    const v = document.getElementById("in-nombre").value.trim();
    if(!v) return;
    state.data.nombre = v;
    go("documento");
  };
}

/* -------------------------- Paso: documento -------------------------- */
function renderDocumento(){
  app().innerHTML = `
    <h1>Documento de identificación</h1>
    <div class="field">
      <label>Tipo de documento</label>
      <select id="in-doctipo">
        <option>Cédula de ciudadanía</option>
        <option>Tarjeta de identidad</option>
        <option>Cédula de extranjería</option>
        <option>Pasaporte</option>
      </select>
    </div>
    <div class="field"><label>Número de documento</label><input id="in-docnum" value="${state.data.documento}"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("in-doctipo").value = state.data.documentoTipo;
  document.getElementById("btn-atras").onclick = () => go("nombre");
  document.getElementById("btn-continuar").onclick = () => {
    state.data.documentoTipo = document.getElementById("in-doctipo").value;
    const v = document.getElementById("in-docnum").value.trim();
    if(!v) return;
    state.data.documento = v;
    go("contacto");
  };
}

/* --------------------------- Paso: contacto --------------------------- */
function renderContacto(){
  app().innerHTML = `
    <h1>Número de contacto</h1>
    <div class="field"><label>Teléfono / celular</label><input id="in-contacto" inputmode="tel" value="${state.data.contacto}" autofocus></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("btn-atras").onclick = () => go("documento");
  document.getElementById("btn-continuar").onclick = () => {
    const v = document.getElementById("in-contacto").value.trim();
    if(!v) return;
    state.data.contacto = v;
    go("entidad");
  };
}

/* --------------------------- Paso: entidad --------------------------- */
function renderEntidad(){
  app().innerHTML = `
    <h1>Entidad a la que pertenecés</h1>
    <p class="sub">Empresa, institución u organización que representás.</p>
    <div class="field"><label>Entidad</label><input id="in-entidad" value="${state.data.entidad}" autofocus></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("btn-atras").onclick = () => go("contacto");
  document.getElementById("btn-continuar").onclick = () => {
    const v = document.getElementById("in-entidad").value.trim();
    if(!v) return;
    state.data.entidad = v;
    go("emergencia");
  };
}

/* -------------------------- Paso: emergencia -------------------------- */
function renderEmergencia(){
  app().innerHTML = `
    <h1>Contacto de emergencia</h1>
    <div class="field"><label>Nombre</label><input id="in-emnombre" value="${state.data.emergenciaNombre}" autofocus></div>
    <div class="field"><label>Número de contacto</label><input id="in-emtel" inputmode="tel" value="${state.data.emergenciaTelefono}"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("btn-atras").onclick = () => go("entidad");
  document.getElementById("btn-continuar").onclick = () => {
    const n = document.getElementById("in-emnombre").value.trim();
    const t = document.getElementById("in-emtel").value.trim();
    if(!n || !t) return;
    state.data.emergenciaNombre = n;
state.data.emergenciaTelefono = t;
go("vehiculo");
};
}
/* --------------------------- Paso: vehículo --------------------------- */
function renderVehiculo() {
  app().innerHTML = `
    <h1>¿Venís en vehículo?</h1>
    <div class="type-grid" id="veh-grid">
      <div class="type-btn" data-val="si"><div class="ic">SI</div><div><div class="tt">Sí</div><div class="dd">Ingresás con vehículo</div></div></div>
      <div class="type-btn" data-val="no"><div class="ic">NO</div><div><div class="tt">No</div><div class="dd">Vas a pie o te dejan</div></div></div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
    </div>
  `;
  const grid = document.getElementById("veh-grid");
  [...grid.children].forEach(b => {
    b.onclick = () => {
      if (b.dataset.val === "si") {
        state.data.vehiculo = true;
        go("placa");
      } else {
        state.data.vehiculo = false;
        state.data.placa = "";
        go("destino");
      }
    };
  });
  document.getElementById("btn-atras").onclick = () => go(state.esConocida ? "confirmar" : "emergencia");
}

/* ----------------------------- Paso: placa ----------------------------- */
function renderPlaca() {
  app().innerHTML = `
    <h1>Placa del vehículo</h1>
    <div class="field"><label>Número de placa</label><input id="in-placa" value="${state.data.placa}" autofocus placeholder="Ej: ABC123"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Atrás</button>
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("btn-atras").onclick = () => go("vehiculo");
  document.getElementById("btn-continuar").onclick = () => {
    const v = document.getElementById("in-placa").value.trim();
    if (!v) return;
    state.data.placa = v.toUpperCase();
    go("destino");
  };
}
/* --------------------------- Paso: destino --------------------------- */
function renderDestino(){
  if(state.data.tipo === "invitado"){
    app().innerHTML = `
      <h1>¿Con quién tenés cita?</h1>
      <div class="field">
        <label>Anfitrión</label>
        <select id="in-anfitrion">
          <option value="">Seleccioná una opción</option>
          ${anfitrionesDisponibles.map(a=>`<option value="${a}">${a}</option>`).join("")}
        </select>
      </div>
      <p class="sub" style="margin-top:14px;">Tu salida será registrada por la persona que te recibe, no es necesario que la registres vos.</p>
      <div class="actions">
        <button class="btn btn-ghost" id="btn-atras">Atrás</button>
        <button class="btn btn-primary" id="btn-continuar">Finalizar registro</button>
      </div>
    `;
    document.getElementById("btn-atras").onclick = () => go(state.data.vehiculo ? "placa" : "vehiculo");
    document.getElementById("btn-continuar").onclick = () => {
      const v = document.getElementById("in-anfitrion").value;
      if(!v) return;
      state.data.anfitrion = v;
      state.data.zona = null;
      finalizarRegistro();
    };
  } else {
    app().innerHTML = `
      <h1>¿Hacia dónde te dirigís?</h1>
      <div class="zones" id="zonas-grid"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="btn-atras">Atrás</button>
        <button class="btn btn-primary" id="btn-continuar" disabled>Finalizar registro</button>
      </div>
    `;
    const grid = document.getElementById("zonas-grid");
    zonas.forEach(z=>{
      const b = document.createElement("div");
      b.className = "zone-btn";
      b.dataset.academic = z.academica ? "1" : "0";
      b.textContent = z.nombre;
      b.onclick = () => {
        [...grid.children].forEach(c=>c.classList.remove("sel"));
        b.classList.add("sel");
        state.data.zona = z;
        document.getElementById("btn-continuar").disabled = false;
      };
      grid.appendChild(b);
    });
    document.getElementById("btn-atras").onclick = () => go(state.data.vehiculo ? "placa" : "vehiculo");
    document.getElementById("btn-continuar").onclick = () => {
      state.data.anfitrion = null;
      finalizarRegistro();
    };
  }
}

/* ------------------------------ Registro ------------------------------ */
async function finalizarRegistro(){
  const btn = document.querySelector(".btn-primary");
  if(btn){ btn.disabled = true; btn.textContent = "Guardando..."; }

  const visita = {
    ...structuredClone(state.data),
    estado: "registrado", // registrado -> verificado -> en_edificio -> salida
    hora: serverTimestamp()
  };

  const conTimeout = (promesa, ms = 15000) => Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);

  try{
    // Guarda/actualiza la ficha de la persona para que la próxima vez se encuentre por cédula
    await conTimeout(setDoc(doc(db, "personas", state.data.documento), {
      nombre: state.data.nombre,
      documentoTipo: state.data.documentoTipo,
      documento: state.data.documento,
      contacto: state.data.contacto,
      entidad: state.data.entidad,
      emergenciaNombre: state.data.emergenciaNombre,
      emergenciaTelefono: state.data.emergenciaTelefono
    }, { merge: true }));

    // Crea el registro de la visita de hoy
    await conTimeout(addDoc(collection(db, "visitas"), visita));

    // Si va a zona académica, dispara la alerta para seguridad
    if(visita.zona && visita.zona.academica){
      await conTimeout(addDoc(collection(db, "alertas"), {
        persona: visita.nombre,
        entidad: visita.entidad,
        destino: visita.zona.nombre,
        hora: serverTimestamp(),
        estado: "pendiente"
      }));
    }
    go("listo");
  }catch(e){
    console.error("Error guardando el registro:", e);
    alert("No pudimos guardar tu registro (" + (e.code || e.message) + "). Revisá tu conexión e intentá de nuevo.");
    if(btn){ btn.disabled = false; btn.textContent = "Finalizar registro"; }
  }
}

/* --------------------------- Paso: listo --------------------------- */
function renderListo(){
  const v = state.data;
  const esInvitado = v.tipo === "invitado";
  const alerta = v.zona && v.zona.academica;
  app().innerHTML = `
    <div class="badge-card">
      <div class="credential">
        <div class="stripe"></div>
        <div class="role">${v.tipo}</div>
        <div class="name">${v.nombre}</div>
        <div class="role" style="color:#b9c0dd;">${v.entidad}</div>
        <div class="code">DOC ${v.documento}</div>
      </div>
      <h1 style="text-align:center;">Registro enviado</h1>
      <p class="sub">Seguridad va a verificar tus datos en el ingreso. Esperá su indicación para pasar.</p>
      ${esInvitado ? `<p class="sub" style="margin-top:-14px;">Anfitrión: <strong>${v.anfitrion}</strong></p>` : `<p class="sub" style="margin-top:-14px;">Destino: <strong>${v.zona.nombre}</strong></p>`}
      ${v.vehiculo ? `<p class="sub" style="margin-top:-14px;">Vehículo: <strong>${v.placa}</strong></p>` : ``}
${alerta ? `<div class="alert-banner">⚠️ Este destino está dentro de la zona académica. Se notificó automáticamente al equipo de seguridad para acompañamiento.</div>` : ``}
      <div class="actions" style="margin-top:24px;">
        <button class="btn btn-primary" id="btn-nuevo">Nuevo registro</button>
      </div>
    </div>
  `;
  document.getElementById("btn-nuevo").onclick = () => {
    state = { step:"cedula", persona:null, esConocida:false, data:{
      tipo:null, nombre:"", documentoTipo:"Cédula de ciudadanía", documento:"",
      contacto:"", entidad:"", emergenciaNombre:"", emergenciaTelefono:"",
      anfitrion:null, zona:null, vehiculo:null, placa:""
    }};
    render();
  };
}

render();
</script>
</body>
</html>
