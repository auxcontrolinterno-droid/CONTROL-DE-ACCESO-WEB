<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182449;
    --ink-soft:#3d4a78;
    --paper:#f5f3ee;
    --card:#ffffff;
    --gold:#c8922f;
    --gold-soft:#f2e3c4;
    --green:#2f7a54;
    --red:#b23a3a;
    --line:#e2ded3;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #22305f 0%, transparent 55%),
      var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    padding-top:84px;
  }
  .kiosk{
    width:100%;
    max-width:520px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    color:var(--ink);
  }
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-soft);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
  }
  .brand span{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    font-size:15px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 20px 50px -25px rgba(24,36,73,.35);
    padding:34px 30px 28px;
    position:relative;
    overflow:hidden;
  }
  .steps{
    display:flex;
    gap:6px;
    margin-bottom:22px;
  }
  .steps i{
    height:4px;
    flex:1;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .steps i b{
    display:block;
    height:100%;
    width:0%;
    background:var(--gold);
    transition:width .35s ease;
  }
  .steps i.done b{width:100%;}
  .steps i.active b{width:100%;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    line-height:1.25;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  p.sub{
    margin:0 0 24px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .field{margin-bottom:16px;}
  .confirm-q{
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .confirm-q:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .field input, .field select{
    width:100%;
    padding:13px 14px;
    border-radius:11px;
    border:1.5px solid var(--line);
    font-size:16px;
    font-family:'Inter',sans-serif;
    background:#fbfaf7;
    color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--gold);
    background:#fff;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .type-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:6px;}
  .type-btn{
    display:flex;align-items:center;gap:12px;
    padding:16px 16px;
    border-radius:13px;
    border:1.5px solid var(--line);
    background:#fbfaf7;
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
  }
  .type-btn:hover{border-color:var(--gold);}
  .type-btn .ic{
    width:38px;height:38px;border-radius:10px;
    background:var(--ink);
    color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    flex-shrink:0;
  }
  .type-btn .tt{font-weight:600;font-size:15px;}
  .type-btn .dd{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .zones{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .zone-btn{
    padding:12px 10px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:#fbfaf7;
    font-size:13.5px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    line-height:1.3;
  }
  .zone-btn.sel{border-color:var(--gold);background:var(--gold-soft);}
  .zone-btn[data-academic="1"].sel{border-color:var(--red);background:#f6dede;}
  .actions{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  button.btn{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--ink);
    color:#fdf9ee;
    flex:1;
  }
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line);
  }
  .badge-card{
    text-align:center;
    padding:10px 0 4px;
  }
  .badge-card .credential{
    margin:0 auto 22px;
    width:220px;
    border-radius:16px;
    background:var(--ink);
    color:#fdf9ee;
    padding:22px 18px 18px;
    position:relative;
    box-shadow:0 18px 30px -18px rgba(24,36,73,.6);
  }
  .credential .stripe{
    position:absolute;top:0;left:0;right:0;height:8px;
    background:var(--gold);
    border-radius:16px 16px 0 0;
  }
  .credential .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
    margin:14px 0 2px;
  }
  .credential .role{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--gold-soft);
  }
  .credential .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#b9c0dd;
    margin-top:14px;
  }
  .alert-banner{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:#f6dede;
    border:1px solid #e3b4b4;
    color:var(--red);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    margin-top:14px;
  }
  .found-banner{
    background:#eaf3ee;
    border:1px solid #b9dcc5;
    color:var(--green);
    border-radius:12px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:18px;
  }
  .hint{font-size:12px;color:var(--ink-soft);margin-top:10px;text-align:center;}
  .school-banner{
    position:fixed;top:0;left:0;right:0;z-index:200;
    background:#ffffff;
    padding:10px 20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .school-banner img{max-height:72px;width:auto;display:block;}
</style>
</head>

<div class="kiosk">
  <div class="brand"><div class="mark">CA</div><span>Control de acceso</span></div>

    <div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, collection, serverTimestamp, query, where
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhsnB9RWok_5Nmb2Nr2vusKETSURnfTO0",
  authDomain: "control-de-acceso-6fbea.firebaseapp.com",
  projectId: "control-de-acceso-6fbea",
  storageBucket: "control-de-acceso-6fbea.firebasestorage.app",
  messagingSenderId: "873946827663",
  appId: "1:873946827663:web:2a0393efbeacb5442799fa"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
// El kiosco no tiene login, pero necesita "request.auth != null" para poder
// leer personas/visitas (ver reglas de Firestore). Un usuario anónimo cumple
// esa condición sin exponer ninguna cuenta real.
const authListo = signInAnonymously(auth).catch((e) => {
  console.warn("No se pudo iniciar sesión anónima, se seguirá como registro nuevo:", e);
});

const anfitriones = [
  "Coordinación Preescolar",
  "Coordinación Primaria",
  "Coordinación Bachillerato",
  "Rectoría",
  "Recursos Humanos",
  "Compras y Suministros"
]; // lista de respaldo, solo se usa si falla la carga desde Firestore

let anfitrionesDisponibles = [...anfitriones];

async function cargarAnfitriones() {
  try {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 5000));
    const snap = await Promise.race([getDocs(collection(db, "areas")), timeout]);
    const nombres = snap.docs.map(d => d.data().nombre).filter(Boolean);
    if (nombres.length) {
      anfitrionesDisponibles = [...new Set(nombres)].sort((a, b) => a.localeCompare(b, "es"));
      if (state.step === "destino" || state.step === "confirmar") render(); // refresca el desplegable si ya está en pantalla
    }
  } catch (e) {
    console.warn("No se pudo cargar la lista de áreas, se usa la lista de respaldo:", e);
  }
}
cargarAnfitriones();

const zonas = [
  { nombre: "Edificio administrativo", academica: false },
  { nombre: "Centro de innovación", academica: false },
  { nombre: "Cocina", academica: false },
  { nombre: "Cafetorium", academica: false },
  { nombre: "Petit cafetorium", academica: false },
  { nombre: "Polideportivo", academica: false },
  { nombre: "Canchas externas", academica: false },
  { nombre: "Edificio académico (preescolar, primaria, bachillerato)", academica: true }
];

/* ------------------------------------------------------------------
   Estado del wizard
   ------------------------------------------------------------------ */
let state = {
  step: "cedula",       // cedula -> tipo -> nombre -> documento -> contacto -> entidad -> emergencia -> destino -> listo
  persona: null,
  esConocida: false,
  invitacionToken: null,
  data: {
    tipo: null,
    nombre: "",
    documentoTipo: "Cédula de ciudadanía",
    documento: "",
    contacto: "",
    entidad: "",
    emergenciaNombre: "",
    emergenciaTelefono: "",
    anfitrion: null,
  zona: null,
  vehiculo: null,
  placa: ""
}
};

const totalStepsFor = () => state.esConocida ? 1 : 8; // aprox, solo para la barra de progreso
function stepIndex(){
  const order = state.esConocida
    ? ["cedula","confirmar","listo"]
    : ["cedula","tipo","nombre","documento","contacto","entidad","emergencia","vehiculo","placa","destino","listo"];
  return order.indexOf(state.step);
}
function stepOrderLength(){
  return state.esConocida ? 3 : 11;
}

function renderSteps(){
  const el = document.getElementById("steps");
  el.innerHTML = "";
  const n = stepOrderLength() - 1; // sin contar "listo" como barra propia visible extra
  for(let i=0;i<n;i++){
    const dot = document.createElement("i");
    if(i < stepIndex()) dot.className = "done";
    else if(i === stepIndex()) dot.className = "active";
    dot.innerHTML = "<b></b>";
    el.appendChild(dot);
  }
}

function go(step){
  state.step = step;
  render();
}

function app(){ return document.getElementById("app"); }

function render(){
  renderSteps();
  const s = state.step;
  if(s === "cedula") return renderCedula();
  if(s === "confirmar") return renderConfirmar();
  if(s === "tipo") return renderTipo();
  if(s === "nombre") return renderNombre();
  if(s === "documento") return renderDocumento();
  if(s === "contacto") return renderContacto();
  if(s === "entidad") return renderEntidad();
  if (s === "emergencia") return renderEmergencia();
if (s === "vehiculo") return renderVehiculo();
if (s === "placa") return renderPlaca();
if (s === "destino") return renderDestino();
  if(s === "listo") return renderListo();
}

/* --------------------------- Paso: cédula --------------------------- */
function renderCedula(){
  app().innerHTML = `
    <h1>Bienvenido</h1>
    <p class="sub">Ingresa tu número de documento para comenzar el registro.</p>
    <div class="field">
      <label>Número de documento</label>
      <input id="in-cedula" inputmode="numeric" placeholder="Ej: 1020304050" autofocus>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById("btn-continuar").onclick = async () => {
    const val = document.getElementById("in-cedula").value.trim();
    if(!val) return;
    state.data.documento = val;

    const btn = document.getElementById("btn-continuar");
    btn.disabled = true; btn.textContent = "Buscando...";

    let encontrada = null;
try {
  await authListo;
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 4000));
  const snap = await Promise.race([getDoc(doc(db, "personas", val)), timeout]);
  if (snap.exists()) encontrada = snap.data();
} catch (e) {
  console.warn("No se pudo verificar el documento a tiempo, se continúa como registro nuevo:", e);
  encontrada = null;
}

    if(encontrada){
      state.persona = encontrada;
      state.esConocida = true;
      state.data.nombre = encontrada.nombre;
      state.data.documentoTipo = encontrada.documentoTipo;
      state.data.contacto = encontrada.contacto;
      state.data.entidad = encontrada.entidad;
      state.data.emergenciaNombre = encontrada.emergenciaNombre;
      state.data.emergenciaTelefono = encontrada.emergenciaTelefono;

      // Además de sus datos personales, busca su última visita para
      // precargar tipo de visita, vehículo y destino (así solo hay
      // que verificar y enviar, sin volver a elegir todo de cero).
      try{
        const timeoutVisitas = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 4000));
        const qUltimaVisita = query(collection(db, "visitas"), where("documento", "==", val));
        const snapVisitas = await Promise.race([getDocs(qUltimaVisita), timeoutVisitas]);
        if(!snapVisitas.empty){
          const previas = snapVisitas.docs.map(d => d.data());
          previas.sort((a, b) => (b.hora?.toMillis?.() || 0) - (a.hora?.toMillis?.() || 0));
          const ultima = previas[0];
          state.data.tipo = ultima.tipo || null;
          state.data.vehiculo = typeof ultima.vehiculo === "boolean" ? ultima.vehiculo : null;
          state.data.placa = ultima.placa || "";
          state.data.zona = ultima.zona || null;
          state.data.anfitrion = ultima.anfitrion || null;
        }
      }catch(e){
        console.warn("No se pudo cargar la última visita para precargar más datos:", e);
      }

      go("tipo");
    } else {
      state.esConocida = false;
      go("tipo");
    }
  };
}

/* ----------------------- Paso: confirmar datos ----------------------- */
/* Persona ya conocida: se precargan sus datos personales y, si hay
   una visita anterior, también tipo de visita, vehículo y destino.
   Solo hay que revisar que todo esté bien y tocar "Enviar registro". */
function renderConfirmar(){
  app().innerHTML = `
    <h1>Confirma tus datos</h1>
    <div class="found-banner">Ya tenemos un registro con este documento. Revisa que todo esté bien y envía tu registro.</div>
    <div class="field"><label>Nombre completo</label><input value="${state.data.nombre}" disabled></div>
    <div class="grid2">
      <div class="field"><label>Contacto</label><input value="${state.data.contacto}" disabled></div>
      <div class="field"><label>Entidad</label><input value="${state.data.entidad}" disabled></div>
    </div>

    <div class="field confirm-q"><label>¿Qué tipo de visita haces hoy?</label></div>
    <div class="type-grid" id="tipo-grid"></div>

    <div class="field confirm-q"><label>¿Vienes en vehículo?</label></div>
    <div class="type-grid" id="veh-grid">
      <div class="type-btn" data-val="si"><div class="ic">SI</div><div><div class="tt">Sí</div><div class="dd">Ingresas con vehículo</div></div></div>
      <div class="type-btn" data-val="no"><div class="ic">NO</div><div><div class="tt">No</div><div class="dd">Vas a pie o te dejan</div></div></div>
    </div>
    <div class="field" id="campo-placa" style="display:none;"><label>Placa del vehículo</label><input id="in-placa" value="${state.data.placa || ""}" placeholder="Ej: ABC123"></div>

    <div id="campo-destino" class="confirm-q"></div>

    <div class="actions">
      <button class="btn btn-ghost" id="btn-atras">Empezar de nuevo</button>
      <button class="btn btn-primary" id="btn-enviar" disabled>Enviar registro</button>
    </div>
  `;

  function validar(){
    const tipoOk = !!state.data.tipo;
    const vehOk = state.data.vehiculo === false || (state.data.vehiculo === true && (state.data.placa || "").trim() !== "");
    const destinoOk = state.data.tipo === "invitado" ? !!state.data.anfitrion : !!state.data.zona;
    document.getElementById("btn-enviar").disabled = !(tipoOk && vehOk && destinoOk);
  }

  /* --- Tipo de visita --- */
  const tipos = [
    {id:"invitado", tt:"Invitado", dd:"Tienes una cita con alguien del colegio", ic:"IN"},
    {id:"proveedor", tt:"Proveedor", dd:"Entregas o suministras algo", ic:"PR"},
    {id:"contratista", tt:"Contratista", dd:"Realizas un trabajo o servicio", ic:"CT"}
  ];
  const tipoGrid = document.getElementById("tipo-grid");
  tipos.forEach(t=>{
    const b = document.createElement("div");
    b.className = "type-btn";
    b.innerHTML = `<div class="ic">${t.ic}</div><div><div class="tt">${t.tt}</div><div class="dd">${t.dd}</div></div>`;
    if(t.id === state.data.tipo) b.style.borderColor = "var(--gold)";
    b.onclick = () => {
      state.data.tipo = t.id;
      [...tipoGrid.children].forEach(c=>c.style.borderColor="var(--line)");
      b.style.borderColor = "var(--gold)";
      renderCampoDestino();
      validar();
    };
    tipoGrid.appendChild(b);
  });

  /* --- Vehículo --- */
  const vehGrid = document.getElementById("veh-grid");
  const campoPlaca = document.getElementById("campo-placa");
  [...vehGrid.children].forEach(b=>{
    if((b.dataset.val === "si") === (state.data.vehiculo === true)) b.style.borderColor = "var(--gold)";
    b.onclick = () => {
      [...vehGrid.children].forEach(c=>c.style.borderColor="var(--line)");
      b.style.borderColor = "var(--gold)";
      if(b.dataset.val === "si"){
        state.data.vehiculo = true;

      } else {
        state.data.vehiculo = false;
        state.data.placa = "";
        campoPlaca.style.display = "none";
      }
      validar();
    };
  });
  if(state.data.vehiculo === true) campoPlaca.style.display = "block";
  document.getElementById("in-placa").oninput = (e) => {
    state.data.placa = e.target.value.trim().toUpperCase();

  };

  /* --- Destino: depende del tipo elegido --- */
  function renderCampoDestino(){
    const cont = document.getElementById("campo-destino");
    if(state.data.tipo === "invitado"){
      cont.innerHTML = `
        <div class="field">
          <label>Anfitrión</label>
          <select id="in-anfitrion">
            <option value="">Selecciona una opción</option>
            ${anfitrionesDisponibles.map(a=>`<option value="${a}" ${a===state.data.anfitrion?"selected":""}>${a}</option>`).join("")}
          </select>
        </div>
        <p class="sub" style="margin-top:-6px;">La salida la registra la persona que te recibe, y la confirma seguridad.</p>
      `;
      document.getElementById("in-anfitrion").onchange = (e) => {
        state.data.anfitrion = e.target.value;
        state.data.zona = null;
        validar();
      };
    } else {
      cont.innerHTML = `
        <div class="field"><label>¿Hacia dónde te diriges?</label></div>
        <div class="zones" id="zonas-grid"></div>
      `;
      const grid = document.getElementById("zonas-grid");
      zonas.forEach(z=>{
        const b = document.createElement("div");
        b.className = "zone-btn";
        b.dataset.academic = z.academica ? "1" : "0";
        b.textContent = z.nombre;
        if(state.data.zona && state.data.zona.nombre === z.nombre) b.classList.add("sel");
        b.onclick = () => {
          [...grid.children].forEach(c=>c.classList.remove("sel"));
          b.classList.add("sel");
          state.data.zona = z;
          state.data.anfitrion = null;
          validar();
        };
        grid.appendChild(b);
      });
    }
  }
  if(state.data.tipo){
    renderCampoDestino();
  } else {
    document.getElementById("campo-destino").innerHTML = `<p class="sub">Elige el tipo de visita para ver las opciones de destino.</p>`;
  }

  validar();

  document.getElementById("btn-atras").onclick = () => {
    state = { step:"cedula", persona:null, esConocida:false, invitacionToken:null, data:{
      tipo:null, nombre:"", documentoTipo:"Cédula de ciudadanía", documento:"",
      contacto:"", entidad:"", emergenciaNombre:"", emergenciaTelefono:"",
      anfitrion:null, zona:null, vehiculo:null, placa:""
    }};
    render();
  };

}

/* ------------------------------ Registro ------------------------------ */
async function finalizarRegistro(){
  const btn = document.querySelector(".btn-primary");
  if(btn){ btn.disabled = true; btn.textContent = "Guardando..."; }

  const visita = {
    ...structuredClone(state.data),
    estado: "registrado", // registrado -> verificado -> en_edificio -> salida
    hora: serverTimestamp()
  };

  const conTimeout = (promesa, ms = 15000) => Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);

  try{
    // Guarda/actualiza la ficha de la persona para que la próxima vez se encuentre por cédula
    await conTimeout(setDoc(doc(db, "personas", state.data.documento), {
      nombre: state.data.nombre,
      documentoTipo: state.data.documentoTipo,
      documento: state.data.documento,
      contacto: state.data.contacto,
      entidad: state.data.entidad,
      emergenciaNombre: state.data.emergenciaNombre,
      emergenciaTelefono: state.data.emergenciaTelefono
    }, { merge: true }));

    // Crea el registro de la visita de hoy
    await conTimeout(addDoc(collection(db, "visitas"), visita));

    // Si vino de un QR de invitación, la marca como usada para que no
    // se pueda volver a registrar con el mismo link/QR.
    if(state.invitacionToken){
      await conTimeout(updateDoc(doc(db, "invitaciones", state.invitacionToken), {
        estado: "usada",
        usadaEn: serverTimestamp()
      })).catch(e => console.warn("No se pudo marcar la invitación como usada:", e));
    }

    // Si va a zona académica, dispara la alerta para seguridad
    if(visita.zona && visita.zona.academica){
      await conTimeout(addDoc(collection(db, "alertas"), {
        persona: visita.nombre,
        entidad: visita.entidad,
        destino: visita.zona.nombre,
        hora: serverTimestamp(),
        estado: "pendiente"
      }));
    }
    go("listo");
  }catch(e){
    console.error("Error guardando el registro:", e);
    alert("No pudimos guardar tu registro (" + (e.code || e.message) + "). Revisa tu conexión e intenta de nuevo.");
    if(btn){ btn.disabled = false; btn.textContent = "Finalizar registro"; }
  }
}

/* ------------------------------------------------------------------
   QR de invitación: si la URL trae ?inv=TOKEN, se precargan los datos
   de la invitación guardada por el anfitrión y se salta directo al
   paso de vehículo (ya no hace falta pedir cédula/nombre/etc. de nuevo).
   ------------------------------------------------------------------ */
async function cargarInvitacion(){
  const params = new URLSearchParams(location.search);
  const token = params.get("inv");
  if(!token) { render(); return; }

  try{
    const snap = await getDoc(doc(db, "invitaciones", token));
    if(snap.exists()){
      const inv = snap.data();
      if(inv.estado === "usada"){
        renderInvitacionUsada(inv);
        return;
      }
      const citaMs = new Date(inv.fecha).getTime();
      const margenMs = 10 * 60 * 1000;
      if(!isNaN(citaMs) && Date.now() < citaMs - margenMs){
        renderInvitacionTemprana(inv, citaMs);
        return;
      }
      state.data.tipo = "invitado";
      state.data.nombre = inv.nombre || "";
      state.data.documento = inv.documento || "";
      state.data.contacto = inv.contacto || "";
      state.data.entidad = inv.entidad || "";
      state.data.emergenciaNombre = inv.emergenciaNombre || "";
      state.data.emergenciaTelefono = inv.emergenciaTelefono || "";
      state.data.anfitrion = inv.anfitrion || null;
      state.esConocida = false;
      state.invitacionToken = token;
      state.step = "vehiculo";
    } else {
      console.warn("La invitación no existe o ya expiró:", token);
    }
  }catch(e){
    console.error("No se pudo cargar la invitación:", e);
  }
  render();
}

/* Pantalla que se muestra si se escanea el QR de invitación con más de
   10 minutos de anticipación a la hora de la cita. */
function renderInvitacionTemprana(inv, citaMs){
  const horaCita = new Date(citaMs).toLocaleString("es-CO", {dateStyle:"medium", timeStyle:"short"});
  const horaDesde = new Date(citaMs - 10*60*1000).toLocaleString("es-CO", {dateStyle:"medium", timeStyle:"short"});
  app().innerHTML = `
    <h1>Todavía es muy temprano</h1>
    <p class="sub">
      Tu cita con <strong>${inv.anfitrion || "tu anfitrión"}</strong> es a las <strong>${horaCita}</strong>.
      Puedes registrar tu ingreso desde las <strong>${horaDesde}</strong> (10 minutos antes de la hora de la cita).
    </p>
    <div class="actions">
      <button class="btn btn-primary" id="btn-reintentar">Reintentar</button>
    </div>
  `;
  document.getElementById("btn-reintentar").onclick = () => location.reload();
}

/* Pantalla que se muestra si el QR de invitación ya fue usado antes. */
function renderInvitacionUsada(inv){
  app().innerHTML = `
    <h1>Invitación ya utilizada</h1>
    <p class="sub">
      Esta invitación${inv.nombre ? " a nombre de <strong>"+inv.nombre+"</strong>" : ""} ya fue registrada anteriormente.
      Si necesitas ingresar de nuevo, pídele a tu anfitrión que genere una nueva invitación.
    </p>
  `;
}

cargarInvitacion();
